name: spec-policy

# pull_request_target runs THIS workflow and scripts/spec_policy.py as they exist on main.
# The PR head is fetched as data and read with `git show`; it is never checked out or
# executed. A PR therefore cannot weaken the policy that judges it.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  spec-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch PR head as data (not executed)
        run: git fetch --no-tags origin "pull/${{ github.event.pull_request.number }}/head:pr-head"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Was owner-approved applied by the owner?
        id: approval
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER_LOGIN: ${{ vars.OWNER_LOGIN }}
        run: |
          actor=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/events" --paginate \
            --jq '[.[] | select(.label.name=="owner-approved") | {e: .event, a: .actor.login}] | last | select(.e=="labeled") | .a')
          echo "owner-approved applied by: ${actor:-nobody}"
          if [ -n "$OWNER_LOGIN" ] && [ "$actor" = "$OWNER_LOGIN" ]; then
            echo "approved=true" >> "$GITHUB_OUTPUT"
          else
            echo "approved=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check policy
        env:
          OWNER_LOGIN: ${{ vars.OWNER_LOGIN }}
          REVIEWER_LOGIN: ${{ vars.REVIEWER_LOGIN }}
          OWNER_APPROVED: ${{ steps.approval.outputs.approved }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          base=$(git merge-base HEAD pr-head)
          python scripts/spec_policy.py check --base "$base" --head pr-head --author "$PR_AUTHOR"
